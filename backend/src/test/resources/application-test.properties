# Pinned so slot arithmetic in the tests is fixed rather than following the
# clinic's real zone through a DST change.
app.clinic.timezone=UTC

app.cors.allowed-origins=http://localhost:3000

app.auth.tokens.issuer=https://beauty-clinic.test
app.auth.tokens.access-ttl=15m
app.auth.tokens.refresh-ttl=12h
app.auth.tokens.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

# Every test shares one address and one JVM, so the real limit would count them together.
# Raised rather than switched off, so the filter still sits in the chain under test.
app.auth.rate-limit.max-requests=100000

# No key in CI, and the starter refuses to build a client without one.
spring.ai.model.chat=none
