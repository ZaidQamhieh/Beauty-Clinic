spring.application.name=backend
spring.mvc.problemdetails.enabled=true
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=validate
# Controllers return DTOs, so nothing should be lazily loaded after the
# service returns. Leaving this on hides that mistake instead of failing.
spring.jpa.open-in-view=false

spring.data.web.pageable.default-page-size=25
spring.data.web.pageable.max-page-size=100

management.endpoints.web.exposure.include=health

app.auth.tokens.issuer=${AUTH_TOKEN_ISSUER:https://beauty-clinic.example}
app.auth.tokens.access-ttl=${AUTH_ACCESS_TTL:15m}
app.auth.tokens.refresh-ttl=${AUTH_REFRESH_TTL:7d}
app.auth.tokens.secret=${AUTH_JWT_SECRET}
