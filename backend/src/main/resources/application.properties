spring.application.name=backend
spring.mvc.problemdetails.enabled=true
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=validate
# Controllers return DTOs, so nothing should be lazily loaded after the
# service returns. Leaving this on hides that mistake instead of failing.
spring.jpa.open-in-view=false

spring.data.web.pageable.default-page-size=25
spring.data.web.pageable.max-page-size=100

# Working hours and "today's schedule" are wall-clock, so they resolve against
# the clinic's own zone, not the server's and not UTC.
app.clinic.timezone=${CLINIC_TIMEZONE:Asia/Hebron}

# Longest session anyone may book; past it, only a doctor or an admin may.
app.clinic.standard-session-max-minutes=${CLINIC_MAX_SESSION_MINUTES:90}

# Price and duration belong to the treatment, and are copied onto the session at booking.
# Every treatment in TreatmentName must appear here or the application refuses to start.
# PLACEHOLDER PRICES - confirm against the clinic's real price list.
app.clinic.tariff.HYDRAFACIAL.price=450.00
app.clinic.tariff.HYDRAFACIAL.duration-minutes=60
app.clinic.tariff.CHEMICAL_PEEL.price=350.00
app.clinic.tariff.CHEMICAL_PEEL.duration-minutes=45
app.clinic.tariff.MICRONEEDLING.price=500.00
app.clinic.tariff.MICRONEEDLING.duration-minutes=60
app.clinic.tariff.DERMAPLANING.price=300.00
app.clinic.tariff.DERMAPLANING.duration-minutes=45
app.clinic.tariff.LASER_HAIR_REMOVAL.price=400.00
app.clinic.tariff.LASER_HAIR_REMOVAL.duration-minutes=30
app.clinic.tariff.LASER_RESURFACING.price=900.00
app.clinic.tariff.LASER_RESURFACING.duration-minutes=90
app.clinic.tariff.IPL_PHOTOFACIAL.price=600.00
app.clinic.tariff.IPL_PHOTOFACIAL.duration-minutes=45
app.clinic.tariff.BOTOX.price=800.00
app.clinic.tariff.BOTOX.duration-minutes=30
app.clinic.tariff.DERMAL_FILLER.price=1200.00
app.clinic.tariff.DERMAL_FILLER.duration-minutes=45
app.clinic.tariff.MESOTHERAPY.price=550.00
app.clinic.tariff.MESOTHERAPY.duration-minutes=45
app.clinic.tariff.BODY_CONTOURING.price=1000.00
app.clinic.tariff.BODY_CONTOURING.duration-minutes=90
app.clinic.tariff.CONSULTATION.price=100.00
app.clinic.tariff.CONSULTATION.duration-minutes=20

management.endpoints.web.exposure.include=health

# No default: an unset origin must fail at startup, not silently allow none.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

app.auth.tokens.issuer=${AUTH_TOKEN_ISSUER:https://beauty-clinic.example}
app.auth.tokens.access-ttl=${AUTH_ACCESS_TTL:15m}
app.auth.tokens.refresh-ttl=${AUTH_REFRESH_TTL:12h}
app.auth.tokens.secret=${AUTH_JWT_SECRET}
