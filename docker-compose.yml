services:
  postgres:
    image: postgres:16-alpine
    container_name: beauty-clinic-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beauty_clinic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beauty_clinic}
      POSTGRES_DB: ${POSTGRES_DB:-beauty_clinic}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beauty_clinic}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: beauty-clinic-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-beauty_clinic}
      DB_USER: ${POSTGRES_USER:-beauty_clinic}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-beauty_clinic}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}
      AUTH_TOKEN_ISSUER: ${AUTH_TOKEN_ISSUER:-https://beauty-clinic.example}
      AUTH_ACCESS_TTL: ${AUTH_ACCESS_TTL:-15m}
      AUTH_REFRESH_TTL: ${AUTH_REFRESH_TTL:-12h}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres_data:


