name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'

  backend:
    name: Backend (Spring Boot)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw -B --no-transfer-progress verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/

  # Fixes what a tool can fix, so nobody pushes twice for a stray space.
  autofix:
    name: Auto-fix (formatting and lints)
    needs: changes
    # A fork's token is read-only, so the fix can only be pushed on branches in this repo.
    if: >
      needs.changes.outputs.frontend == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: frontend

      - name: Apply analyzer fixes
        run: dart fix --apply
        working-directory: frontend

      - name: Format
        run: dart format .
        working-directory: frontend

      # Pushing with GITHUB_TOKEN starts no new run, so this cannot loop.
      - name: Commit whatever changed
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Apply dart fix and dart format"
          git push

  frontend:
    name: Frontend (Flutter web)
    needs: [changes, autofix]
    # autofix is skipped for forks and pushes to main; the checks still run.
    if: always() && needs.changes.outputs.frontend == 'true' && needs.autofix.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          # The branch tip, so this picks up whatever autofix just pushed.
          ref: ${{ github.head_ref || github.ref }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Still a gate, for forks and for anything dart format cannot fix.
      - name: Verify formatting
        if: ${{ !cancelled() }}
        run: dart format --set-exit-if-changed .

      # Every check runs even after one fails, so a run reports all of it at once.
      - name: Analyze
        if: ${{ !cancelled() }}
        run: flutter analyze --fatal-infos

      - name: Test
        if: ${{ !cancelled() }}
        run: flutter test

      - name: Build web
        if: ${{ !cancelled() }}
        run: flutter build web --release

  ci:
    name: CI
    needs: [backend, frontend, autofix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "A required job failed or was cancelled."
            exit 1
          fi
